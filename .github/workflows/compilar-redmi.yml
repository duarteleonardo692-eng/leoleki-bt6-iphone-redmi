name: BT6 - Compilar Redmi v0.8
on:
  workflow_dispatch:
  push:
    branches: [feature/bt6-v08-l2cap-internet]
    paths: ['android/**', 'tests/StreamBridgeTest.java', 'tools/dependencies.py', '.github/workflows/compilar-redmi.yml']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preparar dependencia e SDK fixos
        run: |
          python3 tools/dependencies.py
          if command -v sdkmanager >/dev/null; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0' 
      - name: Testar relay real no computador
        run: |
          mkdir -p tests/build
          javac -d tests/build android/app/src/main/java/app/leoleki/bt6/redmi/StreamBridge.java tests/StreamBridgeTest.java
          java -cp tests/build app.leoleki.bt6.redmi.StreamBridgeTest
      - name: Compilar e analisar APK
        run: gradle -p android :app:assembleDebug :app:lintDebug --no-daemon --console=plain
      - name: Disponibilizar APK experimental
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/BT6-Redmi-v0.8-l2cap-internet.apk
          gh release create "bt6-android-v08-build-${GITHUB_RUN_NUMBER}" dist/BT6-Redmi-v0.8-l2cap-internet.apk --target "$GITHUB_SHA" --title "BT6 Redmi v0.8 experimental" --prerelease --notes "Testado internamente. VPN, emparelhamento e desempenho ainda precisam ser verificados nos aparelhos. Use com iPhone v0.8."
