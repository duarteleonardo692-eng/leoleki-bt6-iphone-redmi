name: BT6 - Compilar Redmi (APK)

on:
  push:
    branches:
      - feature/bt6-v05-vpn-lab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto Android do pacote original
        shell: bash
        run: |
          set -euo pipefail
          ZIP="BT6_Prototipo_v0_1_codigo_e_compilacao_nuvem.zip"
          test -f "$ZIP"
          # Preserva os arquivos v0.5 versionados na raiz do repo.
          unzip -nq "$ZIP" 'android/*'
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/java/app/leoleki/bt6/redmi/MainActivity.java
          test -f android/app/src/main/java/app/leoleki/bt6/redmi/VpnProbeService.java
          grep -q 'app.leoleki.bt6.redmi.v05' android/app/build.gradle
          grep -q 'addAllowedApplication(getPackageName())' android/app/src/main/java/app/leoleki/bt6/redmi/VpnProbeService.java
          grep -q '198.18.0.0' android/app/src/main/java/app/leoleki/bt6/redmi/VpnProbeService.java
          grep -q 'MAX_BODY_BYTES = 8192' android/app/src/main/java/app/leoleki/bt6/redmi/MainActivity.java

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK sem pacote obsoleto
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME:-/not-installed}" || { echo "Android SDK nao encontrado no runner"; exit 1; }
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "sdkmanager nao encontrado"; exit 1; }
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Disponibilizar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de diagnostico
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:assembleDebug --no-daemon --stacktrace
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar APK para download
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/BT6-Redmi-v0.5-vpn-lab.apk
          ls -lh dist/BT6-Redmi-v0.5-vpn-lab.apk

      - name: Publicar APK de teste no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="bt6-android-v05-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/BT6-Redmi-v0.5-vpn-lab.apk \
            --target "$GITHUB_SHA" \
            --title "BT6 Redmi v0.5 - teste ${GITHUB_RUN_NUMBER}" \
            --notes "BT6 Redmi v0.5 VPN LAB experimental. Compatível com iPhone v0.4. VPN SOMENTE opcional, com captura local do próprio BT6 em 198.18.0.0/15; NÃO fornece internet ao Chrome/WhatsApp e pode substituir outra VPN ativa." \
            --prerelease
