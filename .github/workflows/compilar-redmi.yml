name: BT6 - Compilar Redmi (APK)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto Android do pacote original
        shell: bash
        run: |
          set -euo pipefail
          ZIP="BT6_Prototipo_v0_1_codigo_e_compilacao_nuvem.zip"
          test -f "$ZIP"
          unzip -oq "$ZIP" 'android/*'
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/java/app/leoleki/bt6/redmi/MainActivity.java

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Disponibilizar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de diagnostico
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:assembleDebug --no-daemon --stacktrace
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar APK para download
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/BT6-Redmi-v0.1-debug.apk
          ls -lh dist/BT6-Redmi-v0.1-debug.apk

      - name: Publicar APK de teste no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="bt6-android-teste-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/BT6-Redmi-v0.1-debug.apk \
            --target "$GITHUB_SHA" \
            --title "BT6 Redmi - teste ${GITHUB_RUN_NUMBER}" \
            --notes "APK experimental de diagnostico BLE. Instalacao manual no Redmi Note 11. Nao substitui o aplicativo Android antigo e nao habilita internet geral." \
            --prerelease
