name: BT6 - Compilar iPhone (IPA sem assinatura)

on:
  push:
    branches:
      - feature/bt6-v03-transferencia-real
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Extrair codigo do ZIP enviado
        shell: bash
        run: |
          set -euo pipefail
          ZIP="BT6_Prototipo_v0_1_codigo_e_compilacao_nuvem.zip"
          test -f "$ZIP" || { echo "Arquivo BT6 ZIP nao encontrado"; exit 1; }
          # project.yml v0.2 fica no repositorio, com UIBackgroundModes corretos.
          # -n preserva os fontes v0.3 que agora ficam fora do ZIP.
          unzip -nq "$ZIP" 'ios/*'
          test -f project.yml
          test -f ios/Sources/BT6iPhoneApp.swift
          grep -q "BT6 v0.3" ios/Sources/BT6PeripheralBridge.swift
          echo "Fontes iOS v0.3 presentes"

      - name: Mostrar versao do Xcode
        run: xcodebuild -version

      - name: Disponibilizar XcodeGen
        shell: bash
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Gerar projeto Xcode
        run: xcodegen generate --spec project.yml

      - name: Validar permissao BLE em segundo plano
        shell: bash
        run: |
          set -euo pipefail
          test -f ios/Info.plist
          plutil -lint ios/Info.plist
          FOUND=$(/usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" ios/Info.plist)
          test "$FOUND" = "bluetooth-peripheral" || { echo "Background BLE ausente"; exit 1; }

      - name: Verificar identidade isolada v0.3
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'app.leoleki.bt6.iphone.v03' project.yml
          grep -q 'AD08C143-7581-4612-9D63-20D9540C4A11' ios/Sources/BT6PeripheralBridge.swift

      - name: Compilar para iPhone sem assinatura
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project BT6iPhone.xcodeproj \
            -scheme BT6iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BT6Build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empacotar IPA sem assinatura
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BT6Build/Build/Products/Release-iphoneos/BT6iPhone.app"
          test -d "$APP"
          MODE=$(/usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$APP/Info.plist")
          test "$MODE" = "bluetooth-peripheral" || { echo "IPA sem background BLE"; exit 1; }
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qr BT6-iPhone-v0.3-unsigned.ipa Payload)
          rm -rf dist/Payload
          ls -lh dist/BT6-iPhone-v0.3-unsigned.ipa

      - name: Publicar IPA na aba Releases (sem usar armazenamento de artefatos)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="bt6-ios-v03-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/BT6-iPhone-v0.3-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --title "BT6 iPhone v0.3 - teste ${GITHUB_RUN_NUMBER}" \
            --notes "IPA v0.3 experimental com transferencia de texto HTTPS por BLE; instalar usando Sideloadly. Nao oferece internet geral a apps Android." \
            --prerelease
