plugins {
    id 'com.android.application'
}

android {
    namespace 'app.leoleki.bt6.redmi'
    compileSdk 34

    defaultConfig {
        // App separado para nao apagar o BT6 v0.1 nem depender do certificado debug anterior.
        applicationId 'app.leoleki.bt6.redmi.v08'
        minSdk 29
        targetSdk 34
        versionCode 90
        versionName '0.8.10-radio-prioritario'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation files("libs/hev-socks5-tunnel-2.20.0.aar") }
